spring.datasource.url=jdbc:${MYSQL_URL}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

#Notification
app.notifications.email.appointment-scheduled.enabled=${EMAIL_APPOINTMENT_SCHEDULE_ENABLED}


# HikariCP: reducir pool de 10 a 5 conexiones
spring.datasource.hikari.maximum-pool-size=5
# Sin conexiones fijas: el pool las cierra tras 1 min sin uso para que Railway pueda dormir el servicio
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Tomcat: reducir de 200 a 20 threads
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# Dirección del frontend para el enlace de recuperación de contraseña
app.frontend-url=${FRONTEND_URL:https://odonto-turno.up.railway.app}

# Remitente de los correos (opcional; si no se carga, se usa MAIL_USERNAME)
app.mail.from=${MAIL_FROM:}

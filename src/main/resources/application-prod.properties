spring.datasource.url=jdbc:${MYSQL_URL}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

#Notification
app.notifications.email.appointment-scheduled.enabled=${EMAIL_APPOINTMENT_SCHEDULE_ENABLED}


# HikariCP: reducir pool de 10 a 5 conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Tomcat: reducir de 200 a 50 threads
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5